{{ define "top-products" }}
<section>
    <div class="w-11/12 lg:w-10/12 2xl:w-8/12 px-4 mx-auto flex items-center justify-between">
        <div>
            <h2 class="text-xs font-medium">ფასდაკლებული პროდუქტი</h2>
            <p class="text-xx font-normal text-gray-500">ყველაზე დიდი განსხვავება ფასებში</p>
        </div>
        <a href="/items" class="text-xs font-medium text-gray-800">ყველა პროდუქტი</a>
    </div>
    <div
            class="w-11/12 lg:w-10/12 2xl:w-8/12 mx-auto px-4 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3"
            x-data="{
                items: [],
                filteredItems: [],
                filterData(){
                    this.filteredItems = this.items.filter(item => item)
                }
            }"
            x-init="items = {{ . }}; filterData();">

        <template x-for="item in filteredItems" :key="item.id">
            <div class="col-span-1" x-on:click="fetchPrices(item.id)">
                <!-- Image -->
                <div class="w-full !h-[175px] bg-white w-full relative cursor-pointer">
                    <img :src="'static/' + item.image" loading="lazy" class="object-contain w-full h-full" />
                </div>
                <!-- Volume -->
                <span
                   x-text="(() => {
                    const vol = item.volume.trim();
                    const num = parseFloat(vol.replace(/[a-zA-Zა-ჰ]+/, ''));
                    if (vol.includes('ml')) return num >= 1000 ? (num / 1000).toFixed(2) + ' ლ' : num + ' მლ';
                    if (vol.includes('g')) return num >= 1000 ? (num / 1000).toFixed(2) + ' კგ' : num + ' გ';
                    if (vol.includes('pcs')) return num + 'x';
                    return vol;
                   })()"
                   :class="(() => {
                    const vol = item.volume.trim();
                    return vol.includes('ml') ? 'bg-green-600 text-white' : vol.includes('g') || vol.includes('pcs') ? 'bg-gray-700 text-white' : '';
                   })()"
                   class="px-1 py-0.5 text-xx cursor-pointer font-normal rounded"
                ></span>
                <div class="cursor-pointer">
                    <!-- Brand Name -->
                    <h4 class="text-xs font-bold mt-2 text-gray-700" x-text="item.company"></h4>
                    <!-- Product Name -->
                    <h2 class="text-xs overflow-hidden text-ellipsis text-gray-900 line-clamp-1 mt-1 font-normal text-gray-800" x-text="item.name"></h2>
                    <!-- Product Name -->
                    <span x-text="(item.min_price/100).toFixed(2)" class="text-base mt-1 font-bold text-gray-900"></span>
                    <template x-if="(item.max_price - item.min_price) > 0.01">
                        <span x-text="(item.max_price/100).toFixed(2)" class="text-sm font-normal text-gray-700 line-through"></span>
                    </template>
                    <template x-if="item.volume.includes('g') || item.volume.includes('mg')  || item.volume.includes('ml') || item.volume.includes('pcs')">
                        <span
                                x-text="(() => {
                                    const vol = item.volume.trim();
                                    const num = parseFloat(vol.replace(/[a-zA-Zა-ჰ]+/, '')) || 0;
                                    if (num === 0) return '';
                                    if (vol.includes('pcs')) return (item.min_price / 100 / num).toFixed(2) + ' ₾ / ცალი';
                                    if (vol.includes('g') || vol.includes('mg')) {
                                        return (((item.min_price/100)/num) * 100).toFixed(2) + ' ₾ / 100გ';
                                    }
                                    if (vol.includes('ml')) {
                                        return (((item.min_price/100)/num) * 100).toFixed(2) + ' ₾ / 100მლ';
                                    }
                                    return 's';
                                })()"
                                class="text-xs font-normal text-gray-600 block mt-1"
                        ></span>
                    </template>
                </div>
            </div>
        </template>
    </div>
</section>
{{ end }}
